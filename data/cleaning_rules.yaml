# data/cleaning_rules.yaml — AGENT-EDITABLE (Tier 2)
# Bumped on every agent edit.
version: 1

# Ordered regex passes. Applied left-to-right.
substitutions:
  - {pattern: '^\s*\d+\s*$', replace: ''}              # bare page numbers (whole string)
  - {pattern: '^\s*\d+\s+', replace: ''}               # leading page number at start of text
  - {pattern: '-\n', replace: ''}                      # de-hyphenate broken lines
  - {pattern: '\s+', replace: ' '}                     # final whitespace squash

length_filters:
  min_chars: 40
  max_chars: 4000

modern_turkish_filter:
  blacklist_file: data/modern_loanwords.txt
  max_ratio: 0.05                                       # reject if > 5% modern tokens

era_routing:
  # Recalibrated 2026-05-12 against observed corpus mass after the Anadolu +
  # Evliya import: 14,426 classical / 9,636 late_ottoman / 191 tanzimat.
  # Tanzimat is intentionally floored at 0.01 to keep the routing well-defined;
  # at <1% raw share, oversampling it harder would memorize those 191 pages.
  # The agent is free to retune these (Tier-2) once a baseline exists.
  classical:    {weight: 0.59}
  late_ottoman: {weight: 0.40}
  tanzimat:     {weight: 0.01}
