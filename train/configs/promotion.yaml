# train/configs/promotion.yaml — AGENT-EDITABLE (Tier 2)
# Sized for ~85M params on 7.97M unique tokens (~7 epochs). See spec §1.1 amendments.
# n_head=8, n_kv_heads=4 → GQA 2:1 ratio (8 Q heads / 4 KV heads); head_dim=80.
profile: promotion
model:
  n_layers: 12
  n_embd: 640
  n_head: 8
  n_kv_heads: 4
  mlp_ratio: 2.67
  rope_theta: 10000.0
  tie_embeddings: false
  init_std: 0.015
  max_seq_len: 2048
training:
  seq_len: 2048
  batch_size: 16
  grad_accum: 4
  total_tokens: 60_000_000
  lr_peak: 6.0e-4
  lr_schedule: cosine
  warmup_steps: 500
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  precision: bf16
  optimizer: adamw
data:
  mix:
    classical: 0.59
    late_ottoman: 0.40
    tanzimat: 0.01
eval:
  every_steps: 200
  smoke_every_steps: 1000
  checkpoint_every_steps: 500
  keep_last_n_checkpoints: 5
  keep_best_n_checkpoints: 3
