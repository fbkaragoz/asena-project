# train/configs/promotion.yaml — AGENT-EDITABLE (Tier 2)
profile: promotion
model:
  n_layers: 18
  n_embd: 768
  n_head: 12
  n_kv_heads: 4
  mlp_ratio: 2.67
  rope_theta: 10000.0
  tie_embeddings: false
  init_std: 0.015
  max_seq_len: 2048
training:
  seq_len: 2048
  batch_size: 16
  grad_accum: 4
  total_tokens: 1_500_000_000
  lr_peak: 6.0e-4
  lr_schedule: cosine
  warmup_steps: 2000
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  precision: bf16
  optimizer: adamw
data:
  mix:
    classical: 0.20
    late_ottoman: 0.55
    tanzimat: 0.25
eval:
  every_steps: 1000
  smoke_every_steps: 5000
  checkpoint_every_steps: 2000
  keep_last_n_checkpoints: 5
  keep_best_n_checkpoints: 3
