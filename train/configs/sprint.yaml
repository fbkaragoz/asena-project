# train/configs/sprint.yaml — AGENT-EDITABLE (Tier 2)
profile: sprint
model:
  n_layers: 6
  n_embd: 384
  n_head: 6
  n_kv_heads: 3
  mlp_ratio: 2.67
  rope_theta: 10000.0
  tie_embeddings: true
  init_std: 0.02
  max_seq_len: 1024
training:
  seq_len: 512
  batch_size: 32
  grad_accum: 1
  total_tokens: 25_000_000
  lr_peak: 3.0e-3
  lr_schedule: cosine
  warmup_steps: 200
  weight_decay: 0.2
  betas: [0.9, 0.95]
  grad_clip: 1.0
  precision: bf16
  optimizer: adamw
data:
  mix:
    classical: 0.20
    late_ottoman: 0.55
    tanzimat: 0.25
eval:
  every_steps: 200
  smoke_at_end: true
